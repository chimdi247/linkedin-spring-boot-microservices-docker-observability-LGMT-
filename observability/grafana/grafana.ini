# Grafana UI configuration (mounted at /etc/grafana/grafana.ini).
# Secrets / host specific values come from GF_* environment variables in docker-compose.yml.
[server]
http_port = 3000
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[analytics]
reporting_enabled = false
check_for_updates = false

[security]
disable_gravatar = true

[users]
default_theme = system

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/linkedin-services.json
min_refresh_interval = 5s

[unified_alerting]
enabled = true
min_interval = 10s

[alerting]
enabled = false

[smtp]
# enabled, host, user, password, from_address are provided as GF_SMTP_* variables (Mailpit by default,
# any real SMTP server in production).
enabled = true
from_name = LinkedIn System Alerts
skip_verify = true

[feature_toggles]
enable = traceqlEditor tempoSearch tempoServiceGraph traceToMetrics

[log]
level = warn
