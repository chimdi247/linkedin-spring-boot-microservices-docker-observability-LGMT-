# Grafana Tempo - single binary, trace blocks in S3 (MinIO locally / AWS S3 in production).
# Expanded with -config.expand-env=true.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9097
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

# Derives RED metrics + service graph from spans and remote-writes them to Mimir
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      dimensions: [http.method]
    span_metrics:
      dimensions: [http.method, http.route, http.response.status_code]
    local_blocks:
      flush_to_storage: true

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION}
      access_key: ${S3_ACCESS_KEY}
      secret_key: ${S3_SECRET_KEY}
      insecure: true
      forcepathstyle: true
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
