# =============================================================================
#  LinkedIn system - the whole stack from ONE file:   docker compose up -d --build
#
#   Browser :3000 --> nginx (SPA) --/api--> api-gateway --> user | post | feed | search | notification
#                                 --/media--> MinIO (S3)     --/otlp--> OpenTelemetry Collector
#   MySQL primary+replica <-- ProxySQL (pooling, read/write split) <-- user/post services
#   Kafka (events) · Redis (feed, notifications) · Elasticsearch (search) · MinIO (S3)
#   Observability: OTel Collector -> Mimir (metrics) / Loki (logs) / Tempo (traces), all on S3, shown in Grafana
# =============================================================================

x-java-otel: &java-otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=linkedin,deployment.environment=local
  OTEL_INSTRUMENTATION_MESSAGING_EXPERIMENTAL_RECEIVE_TELEMETRY_ENABLED: "true"
  OTEL_INSTRUMENTATION_COMMON_DB_STATEMENT_SANITIZER_ENABLED: "true"

x-java-service: &java-service
  restart: unless-stopped
  networks: [linkedin-network]
  labels:
    obs.logs: otlp            # logs go over OTLP (with trace ids); Alloy skips these containers
  mem_limit: 1280m
  cpus: 1.0


services:
  # ===========================================================================
  #  Data stores
  # ===========================================================================
  mysql-primary:
    image: mysql:8.0.40
    container_name: mysql-primary
    restart: unless-stopped
    networks: [linkedin-network]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replpass}
      PROXYSQL_MONITOR_PASSWORD: ${PROXYSQL_MONITOR_PASSWORD:-monitorpass}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:-apprwpass}
      APP_RO_PASSWORD: ${APP_RO_PASSWORD:-appropass}
      EXPORTER_PASSWORD: ${EXPORTER_PASSWORD:-exporterpass}
      TZ: UTC
    ports: ["${MYSQL_PORT:-3307}:3306"]
    volumes:
      - mysql-primary-data:/var/lib/mysql
      - ./docker/mysql/primary.cnf:/etc/mysql/conf.d/primary.cnf:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro        # 01-schema.sql, 02-seed-admin.sql, 03-users.sh
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0

  mysql-replica:
    image: mysql:8.0.40
    container_name: mysql-replica
    restart: unless-stopped
    networks: [linkedin-network]
    depends_on:
      mysql-primary: { condition: service_healthy }
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replpass}
      TZ: UTC
    volumes:
      - mysql-replica-data:/var/lib/mysql
      - ./docker/mysql/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro
      - ./docker/mysql/replica-init:/docker-entrypoint-initdb.d:ro  # attaches to the primary (GTID) on first start
    healthcheck:
      # healthy = server up AND replication threads running (so the schema/users have been replayed)
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SHOW REPLICA STATUS\\G' 2>/dev/null | grep -q 'Replica_SQL_Running: Yes' && mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1 FROM post_db.comments LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 6s
      retries: 60
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0

  proxysql:
    image: proxysql/proxysql:2.7.1
    container_name: proxysql
    restart: unless-stopped
    networks: [linkedin-network]
    depends_on:
      mysql-primary: { condition: service_healthy }
      mysql-replica: { condition: service_healthy }
    environment:
      PROXYSQL_ADMIN_PASSWORD: ${PROXYSQL_ADMIN_PASSWORD:-radminpass}
      PROXYSQL_MONITOR_PASSWORD: ${PROXYSQL_MONITOR_PASSWORD:-monitorpass}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:-apprwpass}
      APP_RO_PASSWORD: ${APP_RO_PASSWORD:-appropass}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "${PROXYSQL_PORT:-6033}:6033"        # MySQL protocol (pooled)
      - "6032:6032"                # admin interface (local only)
    volumes:
      - ./docker/proxysql/proxysql.cnf.tmpl:/etc/proxysql.cnf.tmpl:ro
      - ./docker/proxysql/entrypoint.sh:/entrypoint.sh:ro
      - proxysql-data:/var/lib/proxysql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6033' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1.0

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    networks: [linkedin-network]
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cpus: 0.5

  redis-commander:                       # Redis UI
    image: rediscommander/redis-commander:latest
    container_name: redis-ui
    restart: unless-stopped
    networks: [linkedin-network]
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_HOSTS: local:redis:6379
    ports: ["${REDIS_UI_PORT:-8091}:8081"]
    mem_limit: 256m
    cpus: 0.5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: unless-stopped
    networks: [linkedin-network]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 2g
    cpus: 1.5

  minio:                                 # local S3 (app media + Mimir/Loki/Tempo storage)
    image: elestio/minio:latest
    container_name: minio
    restart: unless-stopped
    networks: [linkedin-network]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: [minio-data:/data]
    mem_limit: 512m
    cpus: 1.0

  minio-init:
    image: pgsty/mc:latest
    container_name: minio-init
    networks: [linkedin-network]
    depends_on: [minio]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-linkedin-media}
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    volumes: ["./docker/scripts/minio-init.sh:/minio-init.sh:ro"]

  # ===========================================================================
  #  Kafka (+ UI, init job, metrics)
  # ===========================================================================
  kafka:
    build: ./docker/kafka
    image: linkedin/kafka-jmx:7.4.0
    container_name: kafka
    restart: unless-stopped
    networks: [linkedin-network]
    ports: ["9092:9092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_OPTS: -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7071:/opt/jmx/jmx-exporter.yml
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_OPTS= JMX_PORT= kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    mem_limit: 1536m
    cpus: 1.5

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-init
    networks: [linkedin-network]
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    entrypoint: ["/bin/bash", "/kafka-init.sh"]
    volumes: ["./docker/scripts/kafka-init.sh:/kafka-init.sh:ro"]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    networks: [linkedin-network]
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["${KAFKA_UI_PORT:-8090}:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms128m -Xmx384m
    mem_limit: 768m
    cpus: 0.75

  # ===========================================================================
  #  Application
  # ===========================================================================
  api-gateway:
    <<: *java-service
    build: ./api-gateway
    image: linkedin/api-gateway
    container_name: api-gateway
    depends_on:
      user-service: { condition: service_healthy }
      post-service: { condition: service_healthy }
      feed-service: { condition: service_healthy }
      search-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    environment:
      <<: *java-otel
      OTEL_SERVICE_NAME: api-gateway
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8081
      POST_SERVICE_URL: http://post-service:8082
      FEED_SERVICE_URL: http://feed-service:8083
      SEARCH_SERVICE_URL: http://search-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      REDIS_HOST: redis

  user-service:
    <<: *java-service
    build: ./user-service
    image: linkedin/user-service
    container_name: user-service
    depends_on:
      mysql-replica: { condition: service_healthy }
      proxysql: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    environment:
      <<: *java-otel
      OTEL_SERVICE_NAME: user-service
      DB_URL: jdbc:mysql://proxysql:6033/user_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&cachePrepStmts=true
      DB_USERNAME: app_rw
      DB_PASSWORD: ${APP_RW_PASSWORD:-apprwpass}
      DB_READ_URL: jdbc:mysql://proxysql:6033/user_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&cachePrepStmts=true
      DB_READ_USERNAME: app_ro
      DB_READ_PASSWORD: ${APP_RO_PASSWORD:-appropass}
      JPA_DDL_AUTO: none
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      AWS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${MEDIA_BUCKET:-linkedin-media}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://136.71.169.139:3000}/media

  post-service:
    <<: *java-service
    build: ./post-service
    image: linkedin/post-service
    container_name: post-service
    depends_on:
      mysql-replica: { condition: service_healthy }
      proxysql: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    environment:
      <<: *java-otel
      OTEL_SERVICE_NAME: post-service
      DB_URL: jdbc:mysql://proxysql:6033/post_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&cachePrepStmts=true
      DB_USERNAME: app_rw
      DB_PASSWORD: ${APP_RW_PASSWORD:-apprwpass}
      DB_READ_URL: jdbc:mysql://proxysql:6033/post_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&cachePrepStmts=true
      DB_READ_USERNAME: app_ro
      DB_READ_PASSWORD: ${APP_RO_PASSWORD:-appropass}
      JPA_DDL_AUTO: none
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${MEDIA_BUCKET:-linkedin-media}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://136.71.169.139:3000}/media

  feed-service:
    <<: *java-service
    build: ./feed-service
    image: linkedin/feed-service
    container_name: feed-service
    depends_on:
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      <<: *java-otel
      OTEL_SERVICE_NAME: feed-service
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      USER_SERVICE_URL: http://user-service:8081

  search-service:
    <<: *java-service
    build: ./search-service
    image: linkedin/search-service
    container_name: search-service
    depends_on:
      elasticsearch: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      <<: *java-otel
      OTEL_SERVICE_NAME: search-service
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  notification-service:
    <<: *java-service
    build: ./notification-service
    image: linkedin/notification-service
    container_name: notification-service
    depends_on:
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      <<: *java-otel
      OTEL_SERVICE_NAME: notification-service
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  frontend:
    build: ./frontend
    image: linkedin/frontend
    container_name: frontend
    restart: unless-stopped
    networks: [linkedin-network]
    depends_on:
      api-gateway: { condition: service_healthy }
    ports: ["${FRONTEND_PORT:-3000}:80"]
    mem_limit: 128m
    cpus: 0.5

  es-seed:                               # indexes the SQL-seeded admin so it shows up in people search
    image: curlimages/curl:8.11.1
    container_name: es-seed
    networks: [linkedin-network]
    depends_on:
      search-service: { condition: service_healthy }
    restart: "no"
    entrypoint: ["/bin/sh", "/es-seed.sh"]
    volumes: ["./docker/scripts/es-seed.sh:/es-seed.sh:ro"]

  # ===========================================================================
  #  Observability:  OTel Collector -> Mimir | Loki | Tempo (S3)  -> Grafana
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: otel-collector
    restart: unless-stopped
    networks: [linkedin-network]
    depends_on: [mimir, loki, tempo]
    environment:
      PROXYSQL_ADMIN_PASSWORD: ${PROXYSQL_ADMIN_PASSWORD:-radminpass}
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    mem_limit: 512m
    cpus: 1.0

  mimir:
    image: grafana/mimir:2.15.0
    container_name: mimir
    restart: unless-stopped
    networks: [linkedin-network]
    user: "0:0"
    depends_on:
      minio-init: { condition: service_completed_successfully }
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true"]
    environment: &s3-env
      S3_ENDPOINT: minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./observability/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    mem_limit: 1g
    cpus: 1.0

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: unless-stopped
    networks: [linkedin-network]
    user: "0:0"
    depends_on:
      minio-init: { condition: service_completed_successfully }
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment: *s3-env
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    mem_limit: 768m
    cpus: 1.0

  tempo:
    image: grafana/tempo:2.7.1
    container_name: tempo
    restart: unless-stopped
    networks: [linkedin-network]
    user: "0:0"
    depends_on:
      minio-init: { condition: service_completed_successfully }
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment: *s3-env
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 768m
    cpus: 1.0

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks: [linkedin-network]
    depends_on: [mimir, loki, tempo, mailpit]
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:-}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM:-}
      GF_SMTP_STARTTLS_POLICY: ${SMTP_STARTTLS_POLICY:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_CONTAINER_REGEX: ${ALERT_CONTAINER_REGEX:-.+}
    volumes:
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 512m
    cpus: 1.0

  alloy:                                 # infrastructure container logs -> Loki
    image: grafana/alloy:v1.7.1
    container_name: alloy
    restart: unless-stopped
    networks: [linkedin-network]
    depends_on: [loki]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 256m
    cpus: 0.5

  mailpit:                               # SMTP sink for the alert e-mails
    image: axllent/mailpit:v1.21
    container_name: mailpit
    restart: unless-stopped
    networks: [linkedin-network]
    ports: ["${MAILPIT_PORT:-8025}:8025"]
    mem_limit: 128m
    cpus: 0.25

  # ----- exporters ------------------------------------------------------------
  cadvisor:                              # container CPU / memory / network / disk
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    networks: [linkedin-network]
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices: ["/dev/kmsg"]
    mem_limit: 512m
    cpus: 0.75

  node-exporter:                         # host (node) CPU / memory / disk / network
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    networks: [linkedin-network]
    pid: host
    command: ["--path.rootfs=/host", "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"]
    volumes: ["/:/host:ro,rslave"]
    mem_limit: 128m
    cpus: 0.25

  mysqld-exporter-primary:
    image: prom/mysqld-exporter:v0.16.0
    container_name: mysqld-exporter-primary
    restart: unless-stopped
    networks: [linkedin-network]
    depends_on:
      mysql-primary: { condition: service_healthy }
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_PASSWORD:-exporterpass}
    command:
      - --mysqld.address=mysql-primary:3306
      - --mysqld.username=exporter
      - --collect.info_schema.tables
      - --collect.info_schema.innodb_metrics
      - --collect.perf_schema.eventsstatements
      - --collect.perf_schema.eventsstatementssum
      - --collect.global_status
      - --collect.global_variables
      - --collect.slave_status
      - --collect.binlog_size
    mem_limit: 128m
    cpus: 0.25

  mysqld-exporter-replica:
    image: prom/mysqld-exporter:v0.16.0
    container_name: mysqld-exporter-replica
    restart: unless-stopped
    networks: [linkedin-network]
    depends_on:
      mysql-replica: { condition: service_healthy }
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_PASSWORD:-exporterpass}
    command:
      - --mysqld.address=mysql-replica:3306
      - --mysqld.username=exporter
      - --collect.info_schema.tables
      - --collect.info_schema.innodb_metrics
      - --collect.perf_schema.eventsstatements
      - --collect.perf_schema.eventsstatementssum
      - --collect.global_status
      - --collect.global_variables
      - --collect.slave_status
    mem_limit: 128m
    cpus: 0.25

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: redis-exporter
    restart: unless-stopped
    networks: [linkedin-network]
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_ADDR: redis://redis:6379
    mem_limit: 64m
    cpus: 0.25

  kafka-exporter:                        # consumer lag, partitions, offsets
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: kafka-exporter
    restart: unless-stopped
    networks: [linkedin-network]
    depends_on:
      kafka: { condition: service_healthy }
    command: ["--kafka.server=kafka:29092"]
    mem_limit: 128m
    cpus: 0.25

networks:
  linkedin-network:
    name: linkedin-network
    driver: bridge

volumes:
  mysql-primary-data:
  mysql-replica-data:
  proxysql-data:
  redis-data:
  elasticsearch-data:
  minio-data:
  kafka-data:
  mimir-data:
  loki-data:
  tempo-data:
  grafana-data:
