# OpenTelemetry Collector (contrib) - the single telemetry hub.
#
#   apps / browser --OTLP--> collector --> metrics: Mimir (remote write)   logs: Loki (OTLP)   traces: Tempo (OTLP)
#   exporters (cAdvisor, node, Kafka JMX, kafka-exporter, redis, mysqld x2, MinIO, Mimir, Loki, Tempo, Grafana)
#       --prometheus scrape--> collector --> Mimir
#   httpcheck (uptime of every service) / nginx / ProxySQL (SQL on its admin stats tables) --> Mimir
#
# Context propagation: services and the browser use W3C `traceparent`; the Java agent copies trace_id/span_id
# onto every log record, so Loki lines link to Tempo traces.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: ["*"]
          allowed_headers: ["*"]

  prometheus:
    config:
      scrape_configs:
        - job_name: cadvisor
          scrape_interval: 15s
          static_configs: [{ targets: ["cadvisor:8080"] }]
        - job_name: node-exporter
          scrape_interval: 15s
          static_configs: [{ targets: ["node-exporter:9100"] }]
        - job_name: kafka-jmx
          scrape_interval: 15s
          static_configs: [{ targets: ["kafka:7071"] }]
        - job_name: kafka-exporter
          scrape_interval: 15s
          static_configs: [{ targets: ["kafka-exporter:9308"] }]
        - job_name: redis
          scrape_interval: 15s
          static_configs: [{ targets: ["redis-exporter:9121"] }]
        - job_name: mysql-primary
          scrape_interval: 15s
          static_configs: [{ targets: ["mysqld-exporter-primary:9104"] }]
        - job_name: mysql-replica
          scrape_interval: 15s
          static_configs: [{ targets: ["mysqld-exporter-replica:9104"] }]
        - job_name: minio
          scrape_interval: 30s
          metrics_path: /minio/v2/metrics/cluster
          static_configs: [{ targets: ["minio:9000"] }]
        - job_name: mimir
          scrape_interval: 30s
          static_configs: [{ targets: ["mimir:9009"] }]
        - job_name: loki
          scrape_interval: 30s
          static_configs: [{ targets: ["loki:3100"] }]
        - job_name: tempo
          scrape_interval: 30s
          static_configs: [{ targets: ["tempo:3200"] }]
        - job_name: grafana
          scrape_interval: 30s
          static_configs: [{ targets: ["grafana:3000"] }]
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs: [{ targets: ["localhost:8888"] }]

  # Uptime / availability + latency of every HTTP service (SLI source). Metrics: httpcheck_status, httpcheck_duration
  httpcheck:
    collection_interval: 15s
    targets:
      - { endpoint: "http://api-gateway:8080/actuator/health",   method: GET }
      - { endpoint: "http://user-service:8081/actuator/health",  method: GET }
      - { endpoint: "http://post-service:8082/actuator/health",  method: GET }
      - { endpoint: "http://feed-service:8083/actuator/health",  method: GET }
      - { endpoint: "http://search-service:8084/actuator/health", method: GET }
      - { endpoint: "http://notification-service:8085/actuator/health", method: GET }
      - { endpoint: "http://frontend:80/healthz",                method: GET }

  nginx:
    endpoint: http://frontend:80/nginx_status
    collection_interval: 15s

  # ProxySQL has no native Prometheus endpoint in this setup: read its admin "stats" schema with SQL.
  sqlquery/proxysql:
    driver: mysql
    datasource: "radmin:${env:PROXYSQL_ADMIN_PASSWORD}@tcp(proxysql:6032)/"
    collection_interval: 15s
    queries:
      - sql: >
          SELECT Variable_Name AS variable_name, Variable_Value AS value
          FROM stats.stats_mysql_global
          WHERE Variable_Name IN ('ProxySQL_Uptime','Client_Connections_connected','Client_Connections_created',
            'Client_Connections_aborted','Client_Connections_non_idle','Server_Connections_connected',
            'Server_Connections_aborted','Server_Connections_created','Server_Connections_delayed',
            'Active_Transactions','Questions','Slow_queries','Com_commit','Com_rollback','Com_begin',
            'ConnPool_get_conn_success','ConnPool_get_conn_failure','ConnPool_get_conn_immediate',
            'ConnPool_get_conn_latency_awareness','MySQL_Thread_Workers','mysql_backend_buffers_bytes',
            'mysql_frontend_buffers_bytes','Query_Processor_time_nsec','Backend_query_time_nsec',
            'Servers_table_version','Access_Denied_Wrong_Password','Access_Denied_Max_Connections',
            'Access_Denied_Max_User_Connections','max_connect_timeouts','Client_Connections_hostgroup_locked',
            'Queries_backends_bytes_sent','Queries_backends_bytes_recv','Queries_frontends_bytes_sent',
            'Queries_frontends_bytes_recv','Total_servers_bytes_sent')
        metrics:
          - metric_name: proxysql.global
            value_column: value
            value_type: double
            data_type: gauge
            attribute_columns: [variable_name]
            description: ProxySQL stats_mysql_global variables (counters are cumulative - use rate())
      - sql: >
          SELECT hostgroup AS hostgroup, srv_host AS srv_host, status AS status,
                 ConnUsed AS conn_used, ConnFree AS conn_free, ConnOK AS conn_ok, ConnERR AS conn_err,
                 MaxConnUsed AS max_conn_used, Queries AS queries, Latency_us AS latency_us,
                 Bytes_data_sent AS bytes_sent, Bytes_data_recv AS bytes_recv
          FROM stats.stats_mysql_connection_pool
        metrics:
          - { metric_name: proxysql.connpool.conn_used,     value_column: conn_used,     value_type: int, data_type: gauge, attribute_columns: [hostgroup, srv_host, status] }
          - { metric_name: proxysql.connpool.conn_free,     value_column: conn_free,     value_type: int, data_type: gauge, attribute_columns: [hostgroup, srv_host, status] }
          - { metric_name: proxysql.connpool.max_conn_used, value_column: max_conn_used, value_type: int, data_type: gauge, attribute_columns: [hostgroup, srv_host, status] }
          - { metric_name: proxysql.connpool.latency_us,    value_column: latency_us,    value_type: int, data_type: gauge, attribute_columns: [hostgroup, srv_host, status] }
          - { metric_name: proxysql.connpool.conn_ok,       value_column: conn_ok,       value_type: int, data_type: gauge, attribute_columns: [hostgroup, srv_host, status] }
          - { metric_name: proxysql.connpool.conn_err,      value_column: conn_err,      value_type: int, data_type: gauge, attribute_columns: [hostgroup, srv_host, status] }
          - { metric_name: proxysql.connpool.queries,       value_column: queries,       value_type: int, data_type: gauge, attribute_columns: [hostgroup, srv_host, status] }
          - { metric_name: proxysql.connpool.bytes_sent,    value_column: bytes_sent,    value_type: int, data_type: gauge, attribute_columns: [hostgroup, srv_host, status] }
          - { metric_name: proxysql.connpool.bytes_recv,    value_column: bytes_recv,    value_type: int, data_type: gauge, attribute_columns: [hostgroup, srv_host, status] }
      - sql: >
          SELECT Command AS command, Total_Time_us AS total_time_us, Total_cnt AS total_cnt
          FROM stats.stats_mysql_commands_counters
          WHERE Command IN ('SELECT','INSERT','UPDATE','DELETE','COMMIT','ROLLBACK','BEGIN')
        metrics:
          - { metric_name: proxysql.commands.time_us, value_column: total_time_us, value_type: int, data_type: gauge, attribute_columns: [command] }
          - { metric_name: proxysql.commands.count,   value_column: total_cnt,     value_type: int, data_type: gauge, attribute_columns: [command] }

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 300
    spike_limit_mib: 80
  batch:
    timeout: 5s
    send_batch_size: 2048
  resource/env:
    attributes:
      - { key: deployment.environment, value: local, action: upsert }
  # the scrape pipeline keeps Prometheus' own job/instance semantics; names stay unchanged

exporters:
  # application metrics (OTLP): every resource attribute becomes a label (service_name, service_namespace, ...)
  prometheusremotewrite/otlp:
    endpoint: http://mimir:9009/api/v1/push
    resource_to_telemetry_conversion:
      enabled: true
    send_metadata: true
    tls: { insecure: true }
  # infrastructure metrics (scraped): labels as scraped
  prometheusremotewrite/scrape:
    endpoint: http://mimir:9009/api/v1/push
    resource_to_telemetry_conversion:
      enabled: false
    tls: { insecure: true }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls: { insecure: true }
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: basic
      address: 0.0.0.0:8888
  pipelines:
    metrics/otlp:
      receivers: [otlp]
      processors: [memory_limiter, resource/env, batch]
      exporters: [prometheusremotewrite/otlp]
    metrics/scrape:
      receivers: [prometheus, httpcheck, nginx, sqlquery/proxysql]
      processors: [memory_limiter, resource/env, batch]
      exporters: [prometheusremotewrite/scrape]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/env, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/env, batch]
      exporters: [otlp/tempo]
