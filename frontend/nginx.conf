# Same-origin front door: SPA + /api (gateway) + /otlp (collector) + /media (S3 bucket)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; variables below make nginx start even when an upstream is down
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /nginx_status {
        stub_status;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    location /api/ {
        set $gateway http://api-gateway:8080;
        client_max_body_size 12m;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_read_timeout 60s;
    }

    # browser traces -> OpenTelemetry Collector (prefix stripped)
    location /otlp/ {
        set $collector http://otel-collector:4318;
        client_max_body_size 4m;
        rewrite ^/otlp/(.*)$ /$1 break;
        proxy_pass $collector;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # uploaded avatars / post images (public-read bucket in MinIO / S3)
    location /media/ {
        set $s3 http://minio:9000;
        rewrite ^/media/(.*)$ /linkedin-media/$1 break;
        proxy_pass $s3;
        proxy_set_header Host minio:9000;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
